<div class="produto-list">
  <div class="produto-list__header">
    <h1>Produtos</h1>
    <button mat-flat-button color="primary">
      <mat-icon>add</mat-icon>
      Novo Produto
    </button>
  </div>

  @if (carregando()) {
  <div class="produto-list__estado">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Carregando produtos...</span>
  </div>
  } @else if (erro()) {
  <div class="produto-list__estado produto-list__estado--erro">
    <mat-icon>error_outline</mat-icon>
    <span>{{ erro() }}</span>
    <button mat-stroked-button (click)="carregarProdutos()">Tentar novamente</button>
  </div>
  } @else if (produtos().length === 0) {
  <div class="produto-list__estado">
    <mat-icon>inventory_2</mat-icon>
    <span>Nenhum produto cadastrado ainda.</span>
  </div>
  } @else {
  <table mat-table [dataSource]="produtos()" class="produto-list__tabela">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let produto">{{ produto.codigo }}</td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let produto">{{ produto.descricao }}</td>
    </ng-container>

    <ng-container matColumnDef="saldo">
      <th mat-header-cell *matHeaderCellDef>Saldo</th>
      <td mat-cell *matCellDef="let produto">{{ produto.saldo }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunasExibidas"></tr>
  </table>
  }
</div>
